<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你的名字 · 项目</title>
<style>
  :root {
    --bg: #131316;
    --card: #1c1c20;
    --text: #ececf0;
    --muted: #8a8a93;
    --border: #2b2b31;
    --accent: #4c8dff;
    --accent-hover: #3d7cf0;
    --img-bg: #232328;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    padding: 56px 20px 40px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 680px; margin: 0 auto; }

  /* ---------- 头部 ---------- */
  header {
    padding-bottom: 28px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    font-size: 24px;
    font-weight: 650;
    letter-spacing: -.02em;
    margin-bottom: 6px;
  }

  .tagline {
    color: var(--muted);
    font-size: 14.5px;
  }

  /* ---------- 项目卡片 ---------- */
  .project {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 22px;
  }

  .project h2 {
    font-size: 18px;
    font-weight: 620;
    letter-spacing: -.01em;
    margin-bottom: 3px;
  }

  .meta {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .project img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    background: var(--img-bg);
  }

  .project p {
    font-size: 14.5px;
    color: var(--muted);
    margin-bottom: 18px;
  }

  /* ---------- 下载按钮 ---------- */
  .download {
    display: inline-block;
    font-size: 14px;
    font-weight: 500;
    color: #ffffff;
    background: var(--accent);
    padding: 9px 20px;
    border-radius: 8px;
    text-decoration: none;
    transition: background .18s;
  }

  .download:hover { background: var(--accent-hover); }

  /* ---------- 页脚 ---------- */
  footer {
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  footer a {
    color: var(--muted);
    text-decoration: none;
    transition: color .18s;
  }

  footer a:hover { color: var(--text); }

  @media (max-width: 480px) {
    body { padding: 36px 16px 28px; }
    h1 { font-size: 21px; }
    .project { padding: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>你的名字</h1>
    <p class="tagline">独立开发者 · 做一些自己会用的小工具</p>
  </header>

  <div class="project">
    <h2>ClipFlow</h2>
    <div class="meta">v2.1.0 · macOS / Windows</div>
    <img src="./screenshots/clipflow.png" alt="ClipFlow 软件截图">
    <p>剪贴板历史管理工具。自动记录复制内容，支持全文搜索、标签分类与快捷键唤出，数据全部保存在本地。</p>
    <a class="download" href="./downloads/ClipFlow.zip" download>下载</a>
  </div>

  <div class="project">
    <h2>InkNote</h2>
    <div class="meta">v0.9.3 · 跨平台</div>
    <img src="./screenshots/inknote.png" alt="InkNote 软件截图">
    <p>极简 Markdown 笔记应用。专注写作本身，支持实时预览、全文检索与 PDF 导出，文件夹即笔记库。</p>
    <a class="download" href="./downloads/InkNote.zip" download>下载</a>
  </div>

  <footer>
    © 2025 你的名字 · <a href="mailto:you@example.com">you@example.com</a>
  </footer>

</div>
</body>
</html>
