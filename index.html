<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目展示</title>
  <style>
    :root {
      --bg: #131316;
      --card: #1c1c20;
      --text: #ececf0;
      --muted: #8a8a93;
      --border: #2b2b31;
      --accent: #4c8dff;
      --accent-hover: #3d7cf0;
      --img-bg: #232328;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding: 56px 20px 40px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
    }

    /* ---------- 头部 ---------- */
    header {
      padding-bottom: 28px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -.02em;
      margin-bottom: 6px;
    }

    .tagline {
      color: var(--muted);
      font-size: 14.5px;
    }

    /* ---------- 项目卡片 ---------- */
    .project {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 22px;
    }

    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .project-title h2 {
      font-size: 18px;
      font-weight: 620;
      letter-spacing: -.01em;
      margin-bottom: 3px;
    }

    .project-title .meta {
      font-size: 13px;
      color: var(--muted);
    }

    /* 小程序码 */
    .qr-wrap {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-wrap img {
      width: 80px;
      height: 80px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--img-bg);
      cursor: zoom-in;
    }

    .qr-tip {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
    }

    /* ---------- 截图区域（修改1：完整显示图片） ---------- */
    .screenshots {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .screenshots img {
      flex: 1;
      min-width: 0;
      /* 改用 contain 完整显示图片，不裁剪 */
      object-fit: contain;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--img-bg);
      cursor: zoom-in;
      transition: border-color .18s;
    }

    .screenshots img:hover {
      border-color: var(--accent);
    }

    /* 给横屏和竖屏截图设置统一高度，配合 contain 完整展示 */
    .screenshots.landscape img {
      height: 180px;
    }

    .screenshots.portrait img {
      height: 260px;
    }

    .project p {
      font-size: 14.5px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    /* ---------- 下载按钮 ---------- */
    .download {
      display: inline-block;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      background: var(--accent);
      padding: 9px 20px;
      border-radius: 8px;
      text-decoration: none;
      transition: background .18s;
    }

    .download:hover {
      background: var(--accent-hover);
    }

    /* ---------- 页脚 ---------- */
    footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color .18s;
    }

    footer a:hover {
      color: var(--text);
    }

    /* ---------- 图片放大弹层（修改2：限制在屏幕75%） ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .88);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s, visibility .2s;
      z-index: 999;
      cursor: zoom-out;
    }

    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }

    .lightbox img {
      /* 最多占屏幕 75% */
      max-width: 75vw;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 8px;
      transform: scale(.96);
      transition: transform .2s;
      background: var(--img-bg);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
    }

    .lightbox.active img {
      transform: scale(1);
    }

    .lightbox-tip {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      color: rgba(255, 255, 255, .5);
      pointer-events: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 36px 16px 28px;
      }

      h1 {
        font-size: 21px;
      }

      .project {
        padding: 18px;
      }

      .screenshots {
        flex-direction: column;
      }

      /* 手机端取消固定高度，让图片自然伸展 */
      .screenshots.landscape img,
      .screenshots.portrait img {
        height: auto;
        max-height: none;
      }

      .project-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .lightbox img {
        /* 手机上适当放大，但依然不超过 85% */
        max-width: 85vw;
        max-height: 85vh;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <h1>8B24FBBF</h1>
      <p class="tagline">独立开发者 · 弄着玩的</p>
    </header>

    <!-- ================= 项目 1：Web 电视直播 ================= -->
    <div class="project">
      <div class="project-header">
        <div class="project-title">
          <h2>Web 电视直播</h2>
          <div class="meta">安卓版 · 支持手机、平板、电视</div>
        </div>
      </div>

      <div class="screenshots landscape">
        <img src="./images/web_tv//1.jpg" alt="Web电视直播 启动界面截图" class="zoomable">
        <img src="./images/web_tv/2.jpg" alt="Web电视直播 频道列表截图" class="zoomable">
      </div>

      <p>调用 WebView 打开电视台官网的直播网页，然后自动全屏播放。<br />支持触屏、电视遥控器，不定期更新频道。</p>
      <a class="download" href="./downloads/WebTV.apk" download>下载 APK</a>
    </div>

    <!-- ================= 项目 2：鼠鼠猛攻随机器 ================= -->
    <div class="project">
      <div class="project-header">
        <div class="project-title">
          <h2>鼠鼠猛攻随机器</h2>
          <div class="meta">微信小程序 · 扫码即用</div>
        </div>
        <div class="qr-wrap">
          <img src="./images/df_tools/qr.jpg" alt="鼠鼠猛攻随机器 小程序码" class="zoomable">
          <span class="qr-tip">扫码体验</span>
        </div>
      </div>

      <div class="screenshots portrait">
        <img src="./images/df_tools/1.jpg" alt="鼠鼠猛攻随机器 结果页截图" class="zoomable">
        <img src="./images/df_tools/2.jpg" alt="鼠鼠猛攻随机器 详情页截图" class="zoomable">
      </div>

      <p>《三角洲行动》烽火模式随机配装工具，随即后需在游戏内手动选择相应装备。<br />本程序为粉丝制作，与《三角洲行动》官方无关。</p>
    </div>

    <footer>
      © 2025 你的名字 · <a href="mailto:you@example.com">you@example.com</a>
    </footer>

  </div>

  <!-- ================= 图片放大弹层 ================= -->
  <div class="lightbox" id="lightbox">
    <img src="" alt="">
    <div class="lightbox-tip">点击任意处或按 Esc 关闭</div>
  </div>

  <script>
    (function () {
      var lightbox = document.getElementById('lightbox');
      var lightboxImg = lightbox.querySelector('img');

      function openLightbox(src, alt) {
        lightboxImg.src = src;
        lightboxImg.alt = alt || '';
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        setTimeout(function () {
          if (!lightbox.classList.contains('active')) {
            lightboxImg.src = '';
          }
        }, 220);
      }

      document.addEventListener('click', function (e) {
        if (e.target.classList.contains('zoomable')) {
          openLightbox(e.target.src, e.target.alt);
        }
      });

      lightbox.addEventListener('click', closeLightbox);

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) {
          closeLightbox();
        }
      });
    })();
  </script>
</body>

</html>
